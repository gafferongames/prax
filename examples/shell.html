<!doctype html>
<!-- The page that hosts an example built for the web. lib/app's web backend adds the example's windows to the body, which
     fills the browser's window. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prax</title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: #1e1e1e; }
</style>
</head>
<body>
<!-- The page's query holds the program's arguments and environment variables. A parameter whose name begins with PR_
     sets that variable, as ?PR_BACKEND_RENDERER=cpu does. Any other parameter is an argument: ?--scene=2 and
     ?arg=--scene&arg=2 both pass the arguments --scene 2. -->
<script>
var Module = {arguments: [], environment: {}};
for (const [name, value] of new URLSearchParams(location.search)) {
    if (name.startsWith("PR_")) {
        Module.environment[name] = value;
        continue;
    }
    if (name !== "arg")
        Module.arguments.push(name);
    if (value !== "")
        Module.arguments.push(value);
}
// The runtime builds its environment before preRun, which adds the variables of the query.
Module.preRun = [function (module) { Object.assign(module.ENV, module.environment); }];
</script>
{{{ SCRIPT }}}
</body>
</html>
